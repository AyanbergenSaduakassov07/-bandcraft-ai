name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  scoring-api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/scoring-api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tags since v8; bump explicitly
      - run: uv sync --locked --group train
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy src tests
      - run: uv run --group train pytest -q
