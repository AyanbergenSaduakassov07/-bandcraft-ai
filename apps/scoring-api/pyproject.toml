[project]
name = "scoring-api"
version = "0.0.0"
description = "BandCraft AI IELTS Writing scoring service"
requires-python = ">=3.12"
dependencies = ["fastapi"]

[dependency-groups]
dev = ["ruff", "black", "mypy", "pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoring_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
