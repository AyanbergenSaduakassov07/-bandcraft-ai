[project]
name = "scoring-api"
version = "0.0.0"
description = "BandCraft AI IELTS Writing scoring service"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastapi",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "pyspellchecker>=0.9.0",
    "python-dotenv>=1.2.3",
    "spacy>=3.8.16",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff",
    "black",
    "mypy",
    "pytest",
    "httpx",
]
train = [
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoring_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Prompt prose: rewrapping would change what the model sees.
"src/scoring_api/pipeline/prompts.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "lightgbm.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
addopts = "-m 'not gemini'"
markers = ["gemini: calls the real Gemini API (opt in with: pytest -m gemini)"]
log_cli = true
log_cli_level = "INFO"
